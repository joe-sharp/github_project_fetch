inherit_gem:
  sharp_style_rubocop: config/default.yml

inherit_mode:
  merge:
    - AllowedMethods

AllCops:
  ExtraDetails: true

Lint/AmbiguousBlockAssociation:
  AllowedPatterns:
    - change

Metrics/AbcSize:
  AllowedMethods:
    - render

Naming/MethodParameterName:
  AllowedNames:
    - 'x'
    - 'y'
    - 'r'

Performance/RedundantMerge:
  MaxKeyValuePairs: 1

RSpec/ExampleLength:
  Exclude:
    - 'spec/github_repo_fetcher/api_response_service_spec.rb'

RSpec/DescribeClass:
  Exclude:
    - 'spec/api/**/*'
    - 'spec/e2e/**/*'

RSpec/AnyInstance:
  Exclude: []

RSpec/VerifiedDoubles:
  Exclude: []
