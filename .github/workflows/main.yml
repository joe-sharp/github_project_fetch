name: Main Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run Rubocop
        run: bundle exec rubocop

      - name: Run RSpec
        env:
          COVERAGE: true
        run: bundle exec rspec --exclude-pattern "spec/e2e/**/*_spec.rb"

      - name: Publish coverage badge
        run: |
          pct=$(ruby -rjson -e 'puts JSON.parse(File.read("coverage/.last_run.json")).dig("result", "line")')
          color=$(ruby -e 'p = ARGV[0].to_f; puts(p >= 90 ? "brightgreen" : p >= 80 ? "yellow" : "red")' "$pct")
          dir=$(mktemp -d)
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${pct}%\",\"color\":\"${color}\"}" > "$dir/coverage.json"
          cd "$dir"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "chore: update coverage badge"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
